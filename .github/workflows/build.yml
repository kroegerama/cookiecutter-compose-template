name: Build

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:assembleDebug :app:assembleRelease testDebugUnitTest

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install cookiecutter
      - name: Render with the example's values
        run: >
          cookiecutter . --no-input -o "$RUNNER_TEMP/render"
          app_name="Compose App" application_id="com.kroegerama.myapp" project_slug="example" min_sdk=27
      - name: Rendered template must match example
        run: diff -r --strip-trailing-cr "$RUNNER_TEMP/render/example" example
